# Commit + hook convention — sourced by the git hooks in this directory.
# This file is plain POSIX shell variable assignments. It is version
# controlled, so edits here apply to everyone on the next clone/install.

# --- commit-msg gate -------------------------------------------------------

# Allowed commit types (extended-regex alternation, no spaces).
ALLOWED_TYPES="feat|fix|bug|chore|docs|refactor|test|perf|ci|build|style|revert"

# Ticket key regex. Default matches Linear-style keys: an upper-case team
# prefix, a dash, and a number (ENG-123, JOD-42, PLATFORM-7).
TICKET_REGEX="[A-Z][A-Z0-9]+-[0-9]+"

# Types that do NOT require a ticket reference. Housekeeping commits that
# rarely map to a ticket. Everything else must carry a ticket key.
TICKET_EXEMPT_TYPES="chore|docs|style|ci"

# Hard cap on the subject line length. 0 disables the check.
MAX_SUBJECT_LENGTH=72

# --- pre-commit ------------------------------------------------------------
# Newline-separated commands run by the pre-commit hook when no external
# hook manager (lefthook / pre-commit framework) is detected. Keep these
# FAST and scoped to staged files. The installer pre-fills sensible
# defaults for the detected ecosystem; edit freely.
# Single-quoted so the substitutions run at hook time, not when this conf is
# sourced, and so the no-staged-Python case short-circuits: ruff with an empty
# file list falls back to linting '.', which drags the repo's pre-existing
# debt into every unrelated commit.
# Run ruff through `uv run` so the gate uses the version pinned in the dev
# dependency group. A developer's system ruff is a different release with a
# different default rule set, which made this hook pass for one machine and
# fail for another on the same commit.
PRECOMMIT_CMDS='files=$(git diff --cached --name-only --diff-filter=ACM -- "*.py"); [ -z "$files" ] || uv run --quiet ruff check --force-exclude $files
files=$(git diff --cached --name-only --diff-filter=ACM -- "*.py"); [ -z "$files" ] || uv run --quiet ruff format --check --force-exclude $files'

# --- pre-push --------------------------------------------------------------
# Newline-separated commands run by the pre-push hook. Empty = disabled.
# Only enable for a genuinely quick suite; slow gates push people toward
# --no-verify. Heavy tests belong in CI.
#
# This mirrors CI's "Lint the changed files" step *exactly*, and it has to
# live here rather than in pre-commit because the two have different scopes:
# pre-commit sees only what is staged for this commit, while CI lints every
# file the branch touches relative to main. A file that was already clean
# when you staged it — or one committed before the hooks were installed —
# passes pre-commit and still fails CI. Pre-push is the last moment the
# branch-wide diff exists locally, so it is the only place a local gate can
# have the same scope as the remote one.
#
# Same two commands, same flags, same ruff (via `uv run`, so the pinned dev
# version decides rather than whatever is on PATH). Each line runs in its own
# shell, so `files` is recomputed rather than shared.
PREPUSH_CMDS='git fetch --no-tags --quiet origin main 2>/dev/null || true
files=$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- "*.py" 2>/dev/null); [ -z "$files" ] || uv run --quiet ruff check --force-exclude $files
files=$(git diff --name-only --diff-filter=ACM origin/main...HEAD -- "*.py" 2>/dev/null); [ -z "$files" ] || uv run --quiet ruff format --check --force-exclude $files'
